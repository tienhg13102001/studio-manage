# HTTP-only config cho NAS (TLS do DSM Reverse Proxy lo). Bind-mount đè default.conf.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API -> backend container
    location /api {
        proxy_pass         http://backend:5002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Cache static assets (content-hashed by Vite → safe to cache forever).
    # Regex locations take priority over the prefix `location /` below, so JS/CSS
    # keep the immutable cache while HTML falls through to the no-cache rule.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback. index.html must NOT be cached, or a browser keeps serving a
    # stale shell that points at an old bundle after a deploy (symptom: new routes
    # like /world 404 / redirect to /portfolio until a hard refresh).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
