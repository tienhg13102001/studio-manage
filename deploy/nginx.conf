# yumestudio.id.vn — domain đi qua Cloudflare (SSL mode Full/Strict), origin dùng cert Let's Encrypt.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name yumestudio.id.vn www.yumestudio.id.vn;

    # Let's Encrypt gia hạn qua webroot (certbot --webroot -w /var/www/certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name yumestudio.id.vn www.yumestudio.id.vn;

    ssl_certificate     /etc/letsencrypt/live/yumestudio.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yumestudio.id.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # Cloudflare có thể ép HTTP→HTTPS, nên challenge cũng phải trả được ở 443
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /api {
        proxy_pass         http://backend:5002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Asset có hash của Vite → cache vĩnh viễn
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback; index.html không cache để deploy mới có hiệu lực ngay
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
