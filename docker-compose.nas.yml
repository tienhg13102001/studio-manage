# ─────────────────────────────────────────────────────────────────────────────
# Compose RUNTIME-ONLY cho NAS — KHÔNG build bất cứ thứ gì trên NAS.
#
# Artifact (frontend/dist, backend/dist, backend/node_modules) được build ở máy
# local rồi rsync sang, mount thẳng vào image gốc (nginx / node). NAS chỉ chạy.
#
# File này được `deploy-nas.sh` rsync sang NAS dưới tên `docker-compose.yml`.
#
# ⚠️ Project name LUÔN phải là `studio-manage` (deploy-nas.sh truyền `-p studio-manage`),
#    nếu không volume dữ liệu Mongo sẽ đổi tên (`<project>_mongodb_data`) và bạn sẽ
#    khởi động vào một database RỖNG.
# ─────────────────────────────────────────────────────────────────────────────
version: '3.9'

services:
  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:4.4 # NAS CPU không hỗ trợ AVX → mongo 5+ crash, dùng 4.4
    container_name: studio-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: studio_db
    volumes:
      - mongodb_data:/data/db
    ports:
      - '27017:27017'
    networks:
      - studio-net
    healthcheck:
      test:
        - CMD-SHELL
        - mongo --quiet -u admin -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval "db.adminCommand('ping').ok"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Backend ───────────────────────────────────────────────────────────────────
  # Image node gốc + mount ./backend (dist + node_modules + src/assets đã rsync).
  # Mount read-only: app chỉ đọc file (pdfkit đọc font trong src/assets/fonts).
  backend:
    image: node:20-alpine
    container_name: studio-backend
    restart: unless-stopped
    working_dir: /app
    command: ['node', 'dist/app.js']
    volumes:
      - ./backend:/app:ro
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://admin:${MONGO_ROOT_PASSWORD}@mongodb:27017/studio_db?authSource=admin
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - studio-net

  # ── Frontend ──────────────────────────────────────────────────────────────────
  # nginx gốc + mount thư mục dist đã build sẵn. Deploy frontend = copy file xong
  # là xong, nginx đọc thẳng từ mount nên KHÔNG cần restart (chỉ reload khi đổi conf).
  #
  # ⚠️ Mount thư mục CHA `./frontend` → `/usr/share/nginx`, nên bản build phải nằm ở
  # `$NAS_PATH/frontend/html/` (khớp với root mặc định `/usr/share/nginx/html`).
  # Lý do không mount thẳng `./frontend/html`: deploy tráo nguyên thư mục để cutover
  # atomic, mà bind-mount gắn theo inode — mount thẳng vào thư mục bị tráo thì
  # container vẫn thấy nội dung CŨ. Mount cha thì nginx nhìn xuyên qua, thấy ngay bản mới.
  # Tên `html` để khớp root mặc định của nginx nên `nginx.nas.conf` không cần sửa gì.
  frontend:
    image: nginx:1.27-alpine
    container_name: studio-frontend
    restart: unless-stopped
    ports:
      - '8090:80' # 8080 đã dùng cho service upload; DSM giữ 80/443
    volumes:
      - ./frontend:/usr/share/nginx:ro
      - ./nginx.nas.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - studio-net

# ── Shared network ─────────────────────────────────────────────────────────────
networks:
  studio-net:
    driver: bridge

# ── Named volumes ──────────────────────────────────────────────────────────────
volumes:
  mongodb_data:
